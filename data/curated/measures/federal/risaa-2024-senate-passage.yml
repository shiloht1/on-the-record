description: >
  Senate passage of H.R. 7888, reauthorizing Section 702 of FISA for two years.
  The Senate rejected every reform amendment offered that day, including a
  warrant requirement for U.S. person queries (42-50) and an amendment appending
  the Fourth Amendment Is Not For Sale Act (31-61), before passing the bill
  unamended. Signed into law April 20, 2024.

