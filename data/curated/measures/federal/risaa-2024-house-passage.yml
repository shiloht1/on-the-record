title: Reforming Intelligence and Securing America Act (RISAA) — House passage
question: On Passage
result: Passed
yea_count: 273
nay_count: 147
description: >
  Passage of H.R. 7888, reauthorizing Section 702 of the Foreign Intelligence
  Surveillance Act for two years. Despite the name, the bill passed without a
  warrant requirement for querying Americans' communications, after the Biggs
  amendment failed on a tie earlier the same day. It also broadened the
  definition of "electronic communication service provider," which critics
  argued swept in ordinary businesses that merely have access to communications
  equipment.

pro_surveillance_position: yea
significance: 3

notes: >
  Paired with the Biggs amendment vote the same day. Members who voted for the
  warrant requirement and then against final passage have a consistent
  anti-warrantless-surveillance record; members who voted against the warrant
  requirement and for passage have a consistent record the other way.

