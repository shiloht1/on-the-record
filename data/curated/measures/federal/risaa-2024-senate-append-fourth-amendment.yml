description: >
  Amendment to attach the Fourth Amendment Is Not For Sale Act — already passed
  by the House two days earlier — to the FISA reauthorization. Rejected 31-61.
  Because this failed, federal agencies may still purchase from data brokers the
  same personal information they would need a warrant to compel.

pro_surveillance_position: nay
