title: Warrant requirement for searching Americans' communications (Biggs amendment to RISAA)
question: On Agreeing to the Amendment
result: Failed
yea_count: 212
nay_count: 212
description: >
  Amendment offered by Rep. Andy Biggs to H.R. 7888 requiring the government to
  obtain a warrant before querying Section 702 data for the communications of
  U.S. persons. Failed on a 212-212 tie — under House rules a tie defeats the
  amendment, so the reauthorization proceeded without a warrant requirement.
  This is the single most direct recorded federal test of whether a member
  supports warrantless access to Americans' communications.

pro_surveillance_position: nay
significance: 3

notes: >
  A YEA vote here is a vote FOR requiring a warrant, i.e. against warrantless
  surveillance. Scoring this the same direction as the passage vote would be
  exactly backwards. The amendment drew support from across both parties, which
  is why it is a high-signal vote rather than a party-line one.

